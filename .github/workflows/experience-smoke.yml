name: Experience smoke

on:
  pull_request:
    paths:
      - 'src/renderer/**'
      - 'src/preload/**'
      - 'scripts/experience-smoke.mjs'
      - '.github/workflows/experience-smoke.yml'
      - 'electron.vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/renderer/**'
      - 'src/preload/**'
      - 'scripts/experience-smoke.mjs'
      - '.github/workflows/experience-smoke.yml'
      - 'electron.vite.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:experience
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-smoke
          path: artifacts/experience-smoke/
          if-no-files-found: warn
          retention-days: 14
