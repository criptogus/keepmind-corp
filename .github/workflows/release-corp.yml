name: Release KeepMind Corp

on:
  push:
    tags: ['corp-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --config electron-builder.corp.yml --mac dmg zip
            onnx: darwin
          - os: windows-2022
            args: --config electron-builder.corp.yml --win nsis --x64 --arm64
            onnx: win32
          - os: ubuntu-latest
            args: --config electron-builder.corp.yml --linux AppImage --x64
            onnx: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node-gyp 9.4.1 requires distutils, removed in Python 3.12+.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run corp:build-brain
      - run: npm run corp:check
      - run: npx electron-vite build
        env:
          KEEPMIND_EDITION: corp
      - name: Prune onnxruntime to target platform
        run: node scripts/prune-onnxruntime.mjs ${{ matrix.onnx }}
      - name: Drop optional ws natives
        # Same rationale as release.yml: no Electron prebuilds, pure-JS fallback.
        run: node -e "const fs=require('fs'); for (const p of ['node_modules/bufferutil','node_modules/utf-8-validate']) fs.rmSync(p,{recursive:true,force:true})"
      - name: Build Corp installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-corp-${{ matrix.os }}
          path: |
            dist-corp/*.dmg
            dist-corp/*.zip
            dist-corp/*.exe
            dist-corp/*.AppImage
            dist-corp/latest*.yml
            dist-corp/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-corp
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-corp/**
          generate_release_notes: true
