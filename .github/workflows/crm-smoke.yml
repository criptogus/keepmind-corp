name: CRM browser smoke

on:
  pull_request:
    paths:
      - 'src/renderer/**'
      - 'src/preload/**'
      - 'src/main/**'
      - 'corp/**'
      - 'tools/lib/crm*'
      - 'scripts/crm-smoke.mjs'
      - '.github/workflows/crm-smoke.yml'
      - 'vite.corp.config.mts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/renderer/**'
      - 'src/preload/**'
      - 'src/main/**'
      - 'corp/**'
      - 'tools/lib/crm*'
      - 'scripts/crm-smoke.mjs'
      - '.github/workflows/crm-smoke.yml'
      - 'vite.corp.config.mts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run corp:build-brain
      - run: npx playwright install --with-deps chromium
      - run: node scripts/crm-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-smoke
          path: artifacts/crm-smoke/
          if-no-files-found: warn
          retention-days: 14
