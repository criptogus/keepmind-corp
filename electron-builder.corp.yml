appId: com.keepmind.corp
productName: KeepMind Corp
icon: build/icon
extends: electron-builder.yml
directories:
  output: dist-corp
files:
  - out/main/**
  - package.json
  - LICENSE
  - NOTICE
extraMetadata:
  main: ./out/main/index-corp.js
  name: keepmind-corp
  description: KeepMind Corp — corporate second brain with organization governance.
extraResources:
  - from: tools/lib
    to: tools/lib
    filter:
      - "**/*"
  - from: corp
    to: corp
    filter:
      - "**/*"
      - "!data/**"
asar: true
publish:
  provider: github
  owner: criptogus
  repo: keepmind-corp
mac:
  extendInfo:
    CFBundleDisplayName: KeepMind Corp
  artifactName: KeepMind-Corp-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  target:
    - dmg
    - zip
nsis:
  uninstallDisplayName: KeepMind Corp
  deleteAppDataOnUninstall: false
  # Keep the physical filename identical to the update manifest and GitHub asset.
  artifactName: KeepMind-Corp-Setup-${version}.${ext}
win:
  target:
    - nsis
linux:
  artifactName: KeepMind-Corp-${version}.${ext}
  category: Office
  target:
    - AppImage
