appId: com.keepmind.app
# Keep the legacy bundle name for compatibility with already-installed updaters.
productName: KeepMind
icon: build/icon
publish:
  provider: github
  owner: criptogus
  repo: keepmind
directories:
  output: dist
files:
  - out/**
  - package.json
  - LICENSE
  - NOTICE
  - src/main/vendor/laya/LICENSE.laya
  - tools/**
  - node_modules/**
asar: true
mac:
  extendInfo:
    CFBundleDisplayName: KeepMind SB
  artifactName: KeepMind-SB-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  target:
    - dmg
    - zip
nsis:
  uninstallDisplayName: KeepMind SB
  deleteAppDataOnUninstall: false
  # Keep the physical filename identical to the update manifest and GitHub asset.
  artifactName: KeepMind-SB-Setup-${version}.${ext}
win:
  target:
    - nsis
linux:
  artifactName: KeepMind-SB-${version}.${ext}
  category: Utility
  target:
    - AppImage

# Shared brain is packaged independently; existing encrypted/native stores are untouched.
extraResources:
  - from: apps/brain/backend
    to: brain/backend
  - from: apps/brain/dist/client
    to: brain/dist/client
  - from: apps/brain/scripts/install-background.py
    to: brain/scripts/install-background.py
  - from: apps/brain/node_modules/libsodium-wrappers-sumo
    to: brain/node_modules/libsodium-wrappers-sumo
  - from: apps/brain/node_modules/libsodium-sumo
    to: brain/node_modules/libsodium-sumo
